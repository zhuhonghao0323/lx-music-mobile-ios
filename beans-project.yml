name: Beans

options:
  deploymentTarget:
    iOS: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  Beans:
    type: application
    platform: iOS
    sources:
      - path: beans-ios
        excludes:
          - "LyricStages/**"
    resources:
      - beans-ios/en.lproj
      - beans-ios/zh-Hans.lproj
    # 歌词舞台必须保留 LyricStages/ 目录结构：舞台 HTML 用相对路径引 assets/ 里的
    # 字体、three.js、gsap（如 508 用 assets/508-three.min.js）。
    # XcodeGen 把 LyricStages 当文件夹资源时会把文件平铺到 App 根目录（assets/ 全部丢失），
    # 所以改用构建后脚本整目录拷贝，包内路径为 Beans.app/LyricStages/<id>.html。
    postBuildScripts:
      - name: 打包歌词舞台（保留 assets 结构）
        basedOnDependencyAnalysis: false
        script: |
          set -e
          SRC="${SRCROOT}/beans-ios/LyricStages"
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/LyricStages"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -R "$SRC/." "$DEST/"
          echo "LyricStages 打包完成：$(find "$DEST" -name '*.html' | wc -l | tr -d ' ') 个 HTML，$(find "$DEST/assets" -type f | wc -l | tr -d ' ') 个资源文件"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beans.app
        MARKETING_VERSION: "1.19.2"
        CURRENT_PROJECT_VERSION: "92"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_OBJC_BRIDGING_HEADER: beans-ios/Beans-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: beans-ios/Info.plist
      properties:
        CFBundleDisplayName: Z Music
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes: [audio]
        UILaunchScreen:
          UIImageName: LaunchBackground
          UIColorName: LaunchBackgroundColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CADisableMinimumFrameDurationOnPhone: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

schemes:
  Beans:
    build:
      targets:
        Beans: all
    run:
      config: Debug
    archive:
      config: Release
